name = "iprp-sportello"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Origini autorizzate (CORS). Aggiungi qui eventuali domini personalizzati.
ALLOWED_ORIGINS = "https://polizia-iprp.web.app,https://polizia-iprp.firebaseapp.com,http://localhost:3000"

# SEGRETI (non vanno qui): impostali con `npx wrangler secret put <NOME>`
#   DISCORD_WEBHOOK_DENUNCE   URL webhook del canale denunce
#   DISCORD_WEBHOOK_PDA       URL webhook del canale porto d'armi
#   DISCORD_WEBHOOK_COLLOQUI  URL webhook del canale colloqui
# Facoltativi (ID ruolo da taggare nell'embed):
#   DISCORD_ROLE_DENUNCE, DISCORD_ROLE_PDA, DISCORD_ROLE_COLLOQUI

# Telegram (facoltativo): le pratiche vengono inoltrate anche al bot @sitepdsbot.
#   TELEGRAM_BOT_TOKEN   token del bot (da @BotFather)
#   TELEGRAM_CHAT_ID     ID della chat/gruppo/canale che riceve le pratiche

# Accesso con Google (facoltativo ma consigliato): rende obbligatorio il login da accounts.google.com
# per inviare le richieste. GOOGLE_CLIENT_ID è un ID pubblico (OAuth "Applicazione web").
#   npx wrangler secret put GOOGLE_CLIENT_ID
# Anti-bot Cloudflare Turnstile (facoltativo):
#   npx wrangler secret put TURNSTILE_SITEKEY   (chiave pubblica del widget)
#   npx wrangler secret put TURNSTILE_SECRET    (chiave segreta)
# Canale Discord per i log degli aggiornamenti di stato (se manca usa quello delle denunce):
#   npx wrangler secret put DISCORD_WEBHOOK_LOG

# Portale di formazione (rotte /formazione/*): dati su Cloudflare D1 (binding "DB").
# Il workflow GitHub "Deploy Worker Sportello" crea il database "iprp-formazione" se non esiste, ne scrive l'id qui
# al posto di __D1_ID__, applica schema.sql e inserisce il corso di esempio. Nessun comando da eseguire a mano.
# Gli amministratori si indicano con la variabile ADMIN_DISCORD_IDS (ID Discord separati da virgola):
# nel workflow arriva dal secret/variabile GitHub omonimo. Gli altri agenti si gestiscono dall'Area Personale.
[[d1_databases]]
binding = "DB"
database_name = "iprp-formazione"
database_id = "__D1_ID__"
