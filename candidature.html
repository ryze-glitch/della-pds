<body>

<main id="main">
<div class="container" style="padding-top:8px">
  <section class="profile" aria-label="Gestione candidature">
    <div class="profile__avatar" aria-hidden="true"><span class="icon" aria-hidden="true">assignment_ind</span></div>

    <div class="profile__actions">
      <a href="/dashboard" class="btn btn--outlined btn--icon-start"><span class="icon" aria-hidden="true">dashboard</span>Torna alla dashboard</a>
      <a href="#" class="btn btn--outlined btn--icon-start" id="dashLogout"><span class="icon" aria-hidden="true">logout</span>Esci dall'account</a>
    </div>

  <section class="cand-wrap" aria-label="Elenco candidature">
    <div class="cand-toolbar">
      <label class="search-bar">
        <span class="icon" aria-hidden="true">search</span>
        <span class="sr-only">Cerca una candidatura</span>
        <input type="text" id="candSearch" class="cand-search" placeholder="Cerca per nome, cognome o ID Discord..." autocomplete="off">
      </label>

<site-footer></site-footer>
<script type="module">
  /* ====================================================================
     FIREBASE AUTH — Dashboard (pagina protetta)
     Questa pagina richiede un utente autenticato: se nessuno è
     loggato, reindirizza a login.html. La configurazione qui sotto
     è la stessa di login.html (è pubblica, non un segreto).
     ==================================================================== */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBrBkzLE_0MLQEXB9YBDW7G05n6aI_ykA0",
    authDomain: "polizia-iprp.firebaseapp.com",
    projectId: "polizia-iprp",
    storageBucket: "polizia-iprp.firebasestorage.app",
    messagingSenderId: "295622243589",
    appId: "1:295622243589:web:abfd6d06dac2f95428f36c",
    measurementId: "G-V4SZTQVN7J"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const dashLogout = document.getElementById('dashLogout');

  // Popolato dopo il login con i dati dell'agente che sta revisionando
  // le candidature, per registrare chi approva/rifiuta ogni domanda.
  let currentAgent = null;

  onAuthStateChanged(auth, async (user) => {
    if(!user){
      // nessun utente loggato: torna alla pagina di accesso
      window.location.href = '/login';
      return;
    }

    // L'accesso a questa pagina è consentito solo agli agenti
    // presenti nella raccolta Firestore "auth-sito" (documento con ID
    // uguale all'ID Discord). Il Worker di login assegna come uid
    // Firebase "discord:<ID>", quindi il prefisso va tolto prima
    // di cercare il documento.
    const discordId = user.uid.startsWith('discord:') ? user.uid.slice('discord:'.length) : user.uid;

    let profile = null;
    try{
      const snap = await getDoc(doc(db, 'auth-sito', discordId));
      if(snap.exists()) profile = snap.data();
    }catch(err){
      console.error(err);
    }

    if(!profile){
      await signOut(auth);
      window.location.href = '/login?denied=1';
      return;
    }

    currentAgent = {
      discordId,
      nome: profile.nome || '',
      cognome: profile.cognome || '',
      grado: profile.grado || ''
    };

    loadCandidature();
  });

  dashLogout.addEventListener('click', async (e) => {
    e.preventDefault();
    try{
      await signOut(auth);
      window.location.href = '/login';
    }catch(err){
      console.error(err);
    }
  });

  /* ====================================================================
     CANDIDATURE — lettura delle risposte dal modulo Google (Google
     Sheets). Il foglio deve essere condiviso come "chiunque abbia il
     link - Visualizzatore" perché questa lettura avvenga senza login
     Google: https://docs.google.com/spreadsheets/d/14IdIkwl3AVXBkC_dx4fRU06H34ba3TA4SEMktNO15Lc/edit
     ==================================================================== */
  const SHEET_ID = '14IdIkwl3AVXBkC_dx4fRU06H34ba3TA4SEMktNO15Lc';
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv';

  const candStatus = document.getElementById('candStatus');
  const candList = document.getElementById('candList');
  const candCount = document.getElementById('candCount');
  const candSearch = document.getElementById('candSearch');

  let allCandidates = [];

  function parseCSV(text){
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i + 1] === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else if(c === '"'){
        inQuotes = true;
      } else if(c === ','){
        row.push(field); field = '';
      } else if(c === '\n'){
        row.push(field); rows.push(row); row = []; field = '';
      } else if(c !== '\r'){
        field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function findCol(headers, needle){
    return headers.findIndex(h => (h || '').toLowerCase().includes(needle));
  }

  function parseItDate(s){
    // L'ora del timestamp di Google Forms non ha lo zero iniziale
    // (es. "2.28.04" invece di "02.28.04"), quindi ore/minuti/secondi
    // vanno letti con 1 o 2 cifre, non esattamente 2.
    const m = /^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2})\.(\d{1,2})\.(\d{1,2})$/.exec((s || '').trim());
    if(!m) return 0;
    return new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +m[6]).getTime();
  }

  function isAffermativo(v){ return /^s(i|ì)/i.test((v || '').trim()); }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, m => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
    ));
  }

  function fieldHtml(label, value){
    return '<div class="cand-field"><div class="cand-field-label">' + escapeHtml(label) +
      '</div><div class="cand-field-value">' + escapeHtml(value || '—') + '</div></div>';
  }

  // Chiave di correzione del quiz IC: ogni domanda vale 5 punti (7 x 5 = 35,
  // il totale mostrato nella colonna "Punteggio"). "match" è una porzione
  // del testo della domanda (senza apostrofi, per evitare differenze di
  // codifica) usata per riconoscerla tra le colonne del foglio.
  const QUIZ_ANSWERS = [
    { match: 'che tipo di servizio', correct: 'Competenza Generale e in Servizio Permanente di Pubblica Sicurezza' },
    { match: 'la volante e che ruolo', correct: "La Volante è l'auto della Polizia che svolge servizio di Pattuglia sul territorio ed è composta Obbligatoriamente da un Capo pattuglia e il Guidatore" },
    { match: 'motto della polizia', correct: 'Sub Lege Libertas' },
    { match: 'animale che rappresenta', correct: 'Pantera' },
    { match: 'arrestato per un totale di 80 mesi', correct: '45 Mesi' },
    { match: 'grado è inserito sotto il vice ispettore', correct: 'Sovrintendente Capo Coordinatore' },
    { match: 'insubordinazione', correct: 'Mancanza Grave nei Confronti del Rispetto e Dei Doveri cui sono Tenuti gli Inferiori nell\'ambito di una Gerarchia.' }
  ];

  function findQuizAnswer(label){
    const l = (label || '').toLowerCase();
    return QUIZ_ANSWERS.find(q => l.includes(q.match));
  }

  function normalizeAnswer(s){
    return (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function quizFieldHtml(label, value, correct){
    const ok = normalizeAnswer(value) === normalizeAnswer(correct);
    return '<div class="cand-field"><div class="cand-field-label">' + escapeHtml(label) +
      ' <span class="cand-quiz-score' + (ok ? ' ok' : ' no') + '">' + (ok ? '5/5' : '0/5') + '</span></div>' +
      '<div class="cand-field-value">' + escapeHtml(value || '—') + '</div></div>';
  }

  function reviewItemClass(review){
    if(review && review.stato === 'approvato') return 'cand-item review-approved';
    if(review && review.stato === 'rifiutato') return 'cand-item review-rejected';
    return 'cand-item';
  }

  function reviewIconHtml(review){
    if(review && review.stato === 'approvato'){
      return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-label="Approvato">' +
        '<circle cx="12" cy="12" r="10" stroke="#7CC576" stroke-width="1.6"/>' +
        '<path d="M7.5 12.5l3 3 6-6.5" stroke="#7CC576" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg>';
    }
    if(review && review.stato === 'rifiutato'){
      return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-label="Rifiutato">' +
        '<circle cx="12" cy="12" r="10" stroke="#e0574a" stroke-width="1.6"/>' +
        '<path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="#e0574a" stroke-width="1.8" stroke-linecap="round"/>' +
        '</svg>';
    }
    return '';
  }

  function reviewInfoHtml(review){
    if(!review) return '<div class="cand-review-info">Nessuna decisione registrata.</div>';
    const chi = ((review.decisoDa && (review.decisoDa.nome + ' ' + review.decisoDa.cognome).trim()) || 'agente sconosciuto');
    const grado = (review.decisoDa && review.decisoDa.grado) ? ' (' + review.decisoDa.grado + ')' : '';
    let quando = '';
    try{ quando = review.decisoIl ? new Date(review.decisoIl).toLocaleString('it-IT') : ''; }catch(e){}
    const verbo = review.stato === 'approvato' ? 'Approvata' : 'Rifiutata';
    let html = '<div class="cand-review-info">' + verbo + ' da ' + escapeHtml(chi) + escapeHtml(grado) + (quando ? ' il ' + escapeHtml(quando) : '') + '</div>';
    if(!canModify(review)){
      html += '<div class="cand-review-locked">Decisione bloccata: solo ' + escapeHtml(chi) + ' può modificarla.</div>';
    }
    return html;
  }

  // Chi ha deciso può ancora cambiare idea; nessun altro agente può
  // sovrascrivere una decisione già presa (controllato anche lato
  // Firestore, non solo qui, per sicurezza reale).
  function canModify(review){
    if(!review) return true;
    return !!(currentAgent && review.decisoDa && review.decisoDa.discordId === currentAgent.discordId);
  }

  async function handleDecision(c, stato, itemEl, updateReviewBox){
    if(!currentAgent) return;
    if(!canModify(c.review)) return;
    const review = {
      stato,
      decisoDa: {
        discordId: currentAgent.discordId,
        nome: currentAgent.nome,
        cognome: currentAgent.cognome,
        grado: currentAgent.grado
      },
      decisoIl: new Date().toISOString()
    };
    try{
      await setDoc(doc(db, 'candidature-review', c.decisionId), {
        stato: review.stato,
        decisoDa: review.decisoDa,
        decisoIl: review.decisoIl,
        candidatoNome: c.nome,
        candidatoDiscordId: c.discordId,
        candidatoDataInvio: c.dataInvio
      });
      c.review = review;
      itemEl.className = reviewItemClass(review) + (itemEl.classList.contains('open') ? ' open' : '');
      const iconEl = itemEl.querySelector('.cand-review-icon');
      if(iconEl) iconEl.innerHTML = reviewIconHtml(review);
      updateReviewBox();
    }catch(err){
      console.error(err);
      alert('Errore nel salvataggio della decisione. Riprova.');
    }
  }

  function renderCandidates(list){
    candList.innerHTML = '';
    if(!list.length){
      candList.innerHTML = '<div class="cand-status">Nessuna candidatura trovata.</div>';
      return;
    }
    list.forEach(c => {
      const item = document.createElement('div');
      item.className = reviewItemClass(c.review);

      const head = document.createElement('div');
      head.className = 'cand-head';
      const etaPulita = (c.eta || '').replace(/\s*anni?\s*$/i, '');
      head.innerHTML =
        '<span class="cand-review-icon">' + reviewIconHtml(c.review) + '</span>' +
        '<span class="cand-name">' + escapeHtml(c.nome || 'Sconosciuto') + '</span>' +
        '<span class="cand-meta">' +
          '<span>' + escapeHtml(c.dataInvio) + '</span>' +
          (etaPulita ? '<span>' + escapeHtml(etaPulita) + ' anni</span>' : '') +
          '<span>' + escapeHtml(c.titolo) + '</span>' +
          '<span>ID: ' + escapeHtml(c.discordId) + '</span>' +
        '</span>' +
        '<span class="cand-badges">' +
          (c.punteggio ? '<span class="cand-badge score">' + escapeHtml(c.punteggio) + '</span>' : '') +
          '<span class="cand-badge' + (isAffermativo(c.fedina) ? '' : ' no') + '">Fedina ' + escapeHtml(c.fedina) + '</span>' +
          '<span class="cand-badge' + (isAffermativo(c.certificato) ? '' : ' no') + '">Cert. ' + escapeHtml(c.certificato) + '</span>' +
          '<span class="cand-badge' + (isAffermativo(c.patente) ? '' : ' no') + '">Pat. B ' + escapeHtml(c.patente) + '</span>' +
        '</span>' +
        '<span class="cand-toggle">Dettagli &#9662;</span>';

      const body = document.createElement('div');
      body.className = 'cand-body';
      let bodyHtml = fieldHtml('Email', c.email) + fieldHtml('Data di nascita', c.dataNascita);
      c.extra.forEach(([label, value]) => {
        const quiz = findQuizAnswer(label);
        bodyHtml += quiz ? quizFieldHtml(label, value, quiz.correct) : fieldHtml(label, value);
      });
      body.innerHTML = bodyHtml;

      const reviewBox = document.createElement('div');
      reviewBox.className = 'cand-review';
      function updateReviewBox(){
        const locked = !canModify(c.review);
        reviewBox.innerHTML =
          '<button type="button" class="cand-btn approve' + (c.review && c.review.stato === 'approvato' ? ' active' : '') + '"' + (locked ? ' disabled' : '') + '>Approva</button>' +
          '<button type="button" class="cand-btn reject' + (c.review && c.review.stato === 'rifiutato' ? ' active' : '') + '"' + (locked ? ' disabled' : '') + '>Rifiuta</button>' +
          reviewInfoHtml(c.review);
        if(!locked){
          reviewBox.querySelector('.approve').addEventListener('click', (e) => {
            e.stopPropagation();
            handleDecision(c, 'approvato', item, updateReviewBox);
          });
          reviewBox.querySelector('.reject').addEventListener('click', (e) => {
            e.stopPropagation();
            handleDecision(c, 'rifiutato', item, updateReviewBox);
          });
        }
      }
      updateReviewBox();
      body.appendChild(reviewBox);

      head.addEventListener('click', () => item.classList.toggle('open'));
      item.appendChild(head);
      item.appendChild(body);
      candList.appendChild(item);
    });
  }

  async function loadReviews(){
    try{
      const snap = await getDocs(collection(db, 'candidature-review'));
      const byId = {};
      snap.forEach(d => { byId[d.id] = d.data(); });
      allCandidates.forEach(c => {
        const r = byId[c.decisionId];
        if(r) c.review = { stato: r.stato, decisoDa: r.decisoDa, decisoIl: r.decisoIl };
      });
    }catch(err){
      console.error(err);
    }
  }

  async function loadCandidature(){
    try{
      const res = await fetch(CSV_URL);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const rows = parseCSV(text).filter(r => r.some(v => v && v.trim() !== ''));
      if(rows.length < 2) throw new Error('Nessuna riga trovata nel foglio');

      const headers = rows[0];
      const colTimestamp = 0;
      const colEmail = findCol(headers, 'indirizzo email');
      const colNome = findCol(headers, 'nome e cognome');
      const colNascita = findCol(headers, 'data di nascita');
      const colTitolo = findCol(headers, 'titolo di studio');
      const colFedina = findCol(headers, 'fedina penale');
      const colCertificato = findCol(headers, 'certificato anamnestico');
      const colPatente = findCol(headers, 'patente');
      const colDiscord = findCol(headers, 'discord');
      const colEta = findCol(headers, 'età ooc');
      const colMotivazione = findCol(headers, 'deciso di entrare');
      const colBackground = findCol(headers, 'raccontaci di te');
      const colPunteggio = findCol(headers, 'punteggio');
      const colConsenso = findCol(headers, 'presa visione');

      const used = new Set([
        colTimestamp, colEmail, colNome, colNascita, colTitolo, colFedina,
        colCertificato, colPatente, colDiscord, colEta, colMotivazione, colBackground,
        colPunteggio, colConsenso
      ].filter(i => i >= 0));

      allCandidates = rows.slice(1).map(r => {
        const extra = [];
        if(colMotivazione >= 0) extra.push([headers[colMotivazione], r[colMotivazione]]);
        if(colBackground >= 0) extra.push([headers[colBackground], r[colBackground]]);
        headers.forEach((h, i) => { if(!used.has(i)) extra.push([h, r[i]]); });

        const discordId = colDiscord >= 0 ? r[colDiscord] : '';
        const dataInvio = r[colTimestamp] || '';

        return {
          dataInvio,
          ts: parseItDate(dataInvio),
          email: colEmail >= 0 ? r[colEmail] : '',
          nome: colNome >= 0 ? r[colNome] : '',
          dataNascita: colNascita >= 0 ? r[colNascita] : '',
          titolo: colTitolo >= 0 ? r[colTitolo] : '',
          fedina: colFedina >= 0 ? r[colFedina] : '',
          certificato: colCertificato >= 0 ? r[colCertificato] : '',
          patente: colPatente >= 0 ? r[colPatente] : '',
          discordId,
          eta: colEta >= 0 ? r[colEta] : '',
          punteggio: colPunteggio >= 0 ? r[colPunteggio] : '',
          decisionId: (discordId + '_' + dataInvio).replace(/[^a-zA-Z0-9]/g, '_'),
          review: null,
          extra
        };
      }).sort((a, b) => b.ts - a.ts);

      await loadReviews();

      candCount.textContent = allCandidates.length + (allCandidates.length === 1 ? ' candidatura' : ' candidature');
      candStatus.style.display = 'none';
      renderCandidates(allCandidates);
    }catch(err){
      console.error(err);
      candCount.textContent = 'Errore';
      candStatus.textContent = 'Impossibile caricare le candidature. Verifica che il foglio Google sia condiviso come "Chiunque abbia il link - Visualizzatore".';
      candStatus.classList.add('error');
    }
  }

  candSearch.addEventListener('input', () => {
    const q = candSearch.value.trim().toLowerCase();
    const filtered = !q ? allCandidates : allCandidates.filter(c =>
      (c.nome || '').toLowerCase().includes(q) ||
      (c.discordId || '').toLowerCase().includes(q) ||
      (c.email || '').toLowerCase().includes(q)
    );
    renderCandidates(filtered);
  });
</script>
</body>
</html>
