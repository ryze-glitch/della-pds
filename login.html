    <div id="loginChoice">

        <svg width="18" height="18" viewBox="0 0 24 18" fill="none"><path fill="#5865F2" d="M20.3 1.8A19.5 19.5 0 0 0 15.6.3a.07.07 0 0 0-.08.04c-.2.36-.43.83-.59 1.2a18 18 0 0 0-5.4 0 12 12 0 0 0-.6-1.2.08.08 0 0 0-.08-.04A19.4 19.4 0 0 0 3.9 1.8a.07.07 0 0 0-.03.03C.9 6.3.1 10.6.5 14.9a.08.08 0 0 0 .03.06 19.6 19.6 0 0 0 5.9 3 .08.08 0 0 0 .08-.03c.46-.62.86-1.28 1.2-1.97a.08.08 0 0 0-.04-.1 12.9 12.9 0 0 1-1.85-.88.08.08 0 0 1 0-.13c.12-.1.25-.2.37-.29a.07.07 0 0 1 .08 0c3.9 1.77 8.1 1.77 11.94 0a.07.07 0 0 1 .08 0c.12.1.25.2.37.3a.08.08 0 0 1 0 .13c-.59.34-1.21.63-1.85.87a.08.08 0 0 0-.04.11c.35.68.76 1.34 1.2 1.96a.08.08 0 0 0 .08.03 19.5 19.5 0 0 0 5.93-3 .08.08 0 0 0 .03-.05c.5-4.97-.83-9.24-3.5-13.06a.06.06 0 0 0-.03-.03zM8.02 12.3c-1.18 0-2.15-1.08-2.15-2.4 0-1.33.95-2.41 2.15-2.41 1.21 0 2.17 1.09 2.15 2.4 0 1.33-.95 2.41-2.15 2.41zm7.97 0c-1.18 0-2.15-1.08-2.15-2.4 0-1.33.95-2.41 2.15-2.41 1.21 0 2.17 1.09 2.15 2.4 0 1.33-.94 2.41-2.15 2.41z"/></svg>

<script type="module">
  /* ====================================================================
     FIREBASE AUTH — Area Personale
     Prima di andare online, sostituisci firebaseConfig con la
     configurazione del TUO progetto Firebase (Console → Project
     Settings → General → Your apps → SDK setup and configuration).
     ==================================================================== */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    signInWithCustomToken,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBrBkzLE_0MLQEXB9YBDW7G05n6aI_ykA0",
    authDomain: "polizia-iprp.firebaseapp.com",
    projectId: "polizia-iprp",
    storageBucket: "polizia-iprp.firebasestorage.app",
    messagingSenderId: "295622243589",
    appId: "1:295622243589:web:abfd6d06dac2f95428f36c",
    measurementId: "G-V4SZTQVN7J"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const btnDiscord = document.getElementById('btnDiscord');
  const btnLogout = document.getElementById('btnLogout');
  const loginChoice = document.getElementById('loginChoice');
  const userCard = document.getElementById('userCard');
  const userAvatar = document.getElementById('userAvatar');
  const userName = document.getElementById('userName');
  const userProvider = document.getElementById('userProvider');
  const statusEl = document.getElementById('loginStatus');

  function setStatus(msg, type){
    statusEl.textContent = msg || '';
    statusEl.className = 'login-status' + (type ? ' ' + type : '');
  }

  function showLoggedIn(user, providerLabel){
    loginChoice.classList.add('hidden');
    userCard.classList.add('active');
    userAvatar.src = user.photoURL || '/assets/crest.png';
    userName.textContent = user.displayName || user.email || 'Agente';
    userProvider.textContent = providerLabel;
  }

  function showLoggedOut(){
    loginChoice.classList.remove('hidden');
    userCard.classList.remove('active');
    if(new URLSearchParams(window.location.search).get('denied') === '1'){
      setStatus('Il tuo account Discord non risulta registrato tra gli agenti. Contatta un amministratore per essere abilitato.', 'error');
    } else {
      setStatus('');
    }
  }

  onAuthStateChanged(auth, (user) => {
    if(user){
      window.location.href = '/dashboard';
    } else {
      showLoggedOut();
    }
  });

  /* --------------------------------------------------------------------
     DISCORD LOGIN
     Firebase non supporta Discord come provider nativo. Il flusso è:
     1) l'utente viene mandato all'endpoint OAuth di Discord
     2) un Cloudflare Worker (cartella discord-oauth-worker/ — nessun
        server esterno, nessuna Cloud Function, nessun piano Blaze)
        riceve il codice, lo scambia con l'API di Discord, e genera
        un Firebase Custom Token
     3) questa pagina riceve il token e lo scambia con
        signInWithCustomToken

     Sostituisci AUTH_WORKER_URL con l'URL pubblico del tuo Worker una
     volta deployato (vedi discord-oauth-worker/README.md), es.
     https://pds-discord-oauth.tuo-nome.workers.dev
     Sostituisci DISCORD_CLIENT_ID con il Client ID della tua app Discord
     (https://discord.com/developers/applications) — questo è l'unico
     dato Discord che può stare nel codice pubblico; il Client Secret
     resta SOLO nei secret del Worker (wrangler secret put).
     -------------------------------------------------------------------- */
  const AUTH_WORKER_URL = "https://pds-discord-oauth.ryzedev63131.workers.dev/discord-auth";
  const DISCORD_CLIENT_ID = "1543034109146959882";
  const DISCORD_REDIRECT_URI = window.location.origin + window.location.pathname;


  btnDiscord.addEventListener('click', () => {
    const params = new URLSearchParams({
      client_id: DISCORD_CLIENT_ID,
      redirect_uri: DISCORD_REDIRECT_URI,
      response_type: 'code',
      scope: 'identify email'
    });
    window.location.href = `https://discord.com/api/oauth2/authorize?${params.toString()}`;
  });

  async function handleDiscordCallback(){
    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');
    if(!code) return;

    setStatus('Completamento accesso con Discord…');
    try{
      const res = await fetch(`${AUTH_WORKER_URL}?code=${encodeURIComponent(code)}&redirect_uri=${encodeURIComponent(DISCORD_REDIRECT_URI)}`);
      if(!res.ok) throw new Error('Cloud Function error: ' + res.status);
      const data = await res.json();
      if(!data.token) throw new Error('Nessun token ricevuto');

      await signInWithCustomToken(auth, data.token);
      setStatus('Accesso con Discord riuscito.', 'success');

      url.searchParams.delete('code');
      window.history.replaceState({}, '', url.pathname + url.hash);
    }catch(err){
      console.error(err);
      setStatus('Accesso con Discord non riuscito. Riprova.', 'error');
    }
  }
  handleDiscordCallback();

  btnLogout.addEventListener('click', async (e) => {
    e.preventDefault();
    try{
      await signOut(auth);
    }catch(err){
      console.error(err);
    }
  });
</script>
</body>
