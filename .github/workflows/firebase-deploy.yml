name: Deploy to Firebase Hosting and Firestore rules

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Il sito (Next.js, export statico) viene costruito qui e pubblicato in site/.
      # Se la cartella `public` di firebase.json non è "site" (es. pagina di manutenzione),
      # questo passo è comunque innocuo.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Build del sito
        working-directory: portal
        run: |
          npm ci
          npm run build

      - name: Prepara la cartella pubblicata
        run: |
          rm -rf site
          cp -r portal/out site
          # Interfaccia IPRP-XI (prototipo statico) come pagina iniziale; la vecchia home resta in /vecchia-home/.
          mkdir -p site/vecchia-home
          cp site/index.html site/vecchia-home/index.html
          cp prototipi/IPRP-XI-DidUP-Fedele/index.html prototipi/IPRP-XI-DidUP-Fedele/styles.css prototipi/IPRP-XI-DidUP-Fedele/app.js site/

      - name: Write service account credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy hosting and Firestore rules
        run: npx firebase-tools deploy --only hosting,firestore:rules --project polizia-iprp --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
