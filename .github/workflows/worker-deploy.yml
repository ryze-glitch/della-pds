name: Deploy Worker Sportello (Cloudflare)

# Si avvia a mano (Actions → Run workflow) oppure quando cambia il Worker.
# Richiede nei Secrets del repository (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token API con i permessi "Workers Scripts: Edit" e "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID dell'account Cloudflare
# Facoltativo ma necessario per entrare nell'Area Personale:
#   ADMIN_DISCORD_IDS      ID Discord degli amministratori, separati da virgola (secret o variabile del repository);
#                          se manca si usa l'ID indicato nel passaggio Deploy
#   SYNC_KEY               password lunga (almeno 16 caratteri) condivisa con lo script Apps Script del foglio Gerarchia,
#                          che invia al Worker gli agenti (nome, matricola, qualifica, ID Discord)
# Il database D1 "iprp-formazione" viene creato e aggiornato da questo workflow: non serve alcun comando a mano.
# Gli altri segreti del Worker (webhook, token Telegram, ecc.) restano su Cloudflare e NON passano da qui.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workers/sportello/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla i secret
        id: check
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::warning::Secret CLOUDFLARE_API_TOKEN non impostato: il Worker NON è stato distribuito."; fi
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20

      - name: Test
        if: steps.check.outputs.skip != 'true'
        working-directory: workers/sportello
        run: node --test test/handler.test.mjs test/formazione.test.mjs

      - name: Installa Wrangler
        if: steps.check.outputs.skip != 'true'
        working-directory: workers/sportello
        run: npm ci || npm install

      - name: Prepara il database D1
        if: steps.check.outputs.skip != 'true'
        working-directory: workers/sportello
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="iprp-formazione") | .uuid' | head -n1)
          if [ -z "$ID" ]; then
            npx wrangler d1 create iprp-formazione
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="iprp-formazione") | .uuid' | head -n1)
          fi
          if [ -z "$ID" ]; then echo "::error::Impossibile creare o trovare il database D1 (il token ha il permesso D1: Edit?)"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx wrangler d1 execute iprp-formazione --remote --file=schema.sql
          node scripts/seed-sql.mjs > /tmp/seed.sql
          npx wrangler d1 execute iprp-formazione --remote --file=/tmp/seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        working-directory: workers/sportello
        run: |
          # Amministratore iniziale: Gabriel Martinelli (PDS-0006), proprietario del sito. Modificabile con ADMIN_DISCORD_IDS.
          ADMIN="${ADMIN_IDS:-1387684968536477756}"
          npx wrangler deploy --var "ADMIN_DISCORD_IDS:$ADMIN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_DISCORD_IDS || vars.ADMIN_DISCORD_IDS }}

      - name: Chiave di sincronizzazione del foglio
        if: steps.check.outputs.skip != 'true'
        working-directory: workers/sportello
        run: |
          if [ -n "$SYNC_KEY" ]; then printf '%s' "$SYNC_KEY" | npx wrangler secret put SYNC_KEY; else echo "::warning::SYNC_KEY non impostato: la sincronizzazione dal foglio Gerarchia non funzionerà."; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
